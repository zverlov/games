<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">Ein Glas Orangensaft, ein Stück Kuchen und einen Apfel</title>
  <rect width="400" height="300" rx="18" fill="#f7f3ea"/>
  <ellipse cx="200" cy="250" rx="170" ry="10" fill="#000" opacity="0.06"/>
  <g stroke="#2b2420" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Glas Orangensaft -->
    <g transform="translate(80 236)">
      <path d="M8 -132 L20 -60" stroke="#e2372b" stroke-width="7"/>
      <path d="M8 -132 L20 -60" stroke="#fff" stroke-width="2" stroke-dasharray="6 6"/>
      <path d="M-32 -110 H32 L26 0 H-26 Z" fill="#cfe9f7"/>
      <path d="M-29 -78 H29 L26 0 H-26 Z" fill="#f6931e" stroke="none"/>
      <path d="M-32 -110 H32 L26 0 H-26 Z" fill="none"/>
      <path d="M-22 -60 q-4 20 -2 44" fill="none" stroke="#fff" stroke-width="4" opacity="0.6"/>
      <!-- Orangenscheibe am Rand -->
      <path d="M-40 -116 a20 20 0 0 1 40 0 Z" fill="#f6931e" transform="translate(-8 0)"/>
      <path d="M-40 -116 a20 20 0 0 1 40 0 Z" fill="none" stroke="#fff" stroke-width="2" transform="translate(-8 0) scale(0.7) translate(-9 -50)"/>
    </g>
    <!-- Stück Kuchen -->
    <g transform="translate(200 236)">
      <ellipse cx="0" cy="4" rx="60" ry="12" fill="#fff"/>
      <path d="M-40 0 L40 0 L28 -62 L-28 -62 Z" fill="#f3d9a6"/>
      <path d="M-34 -31 L34 -31" stroke="#e2372b" stroke-width="9"/>
      <ellipse cx="0" cy="-62" rx="28" ry="9" fill="#fff8ec"/>
      <path d="M0 -74 q6 -12 10 -18" fill="none" stroke-width="3"/>
      <circle cx="0" cy="-74" r="7" fill="#e2372b"/>
    </g>
    <!-- Apfel -->
    <g transform="translate(320 236)">
      <path d="M0 -62 q-2 -14 6 -22" fill="none" stroke-width="5"/>
      <path d="M6 -76 q18 -8 24 4 q-18 8 -24 -4 Z" fill="#3aa655"/>
      <path d="M0 -56 C -40 -70 -48 -10 -14 -2 Q0 4 14 -2 C 48 -10 40 -70 0 -56 Z" fill="#e2372b"/>
      <path d="M-20 -40 q-6 10 -4 22" fill="none" stroke="#fff" stroke-width="5" opacity="0.6"/>
    </g>
  </g>
</svg>
